<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Message sent — GoGizbi!</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;background:#FFFDF7;color:#161616;
    background-image:radial-gradient(#e6dfcc 1px,transparent 1px);background-size:22px 22px;padding:24px;text-align:center}
  .card{background:#fff;border:3px solid #161616;border-radius:22px;box-shadow:10px 10px 0 #161616;padding:50px 40px;max-width:520px}
  h1{font-size:2.2rem;letter-spacing:-.03em;margin:10px 0}
  .hand{font-family:Caveat,cursive;font-size:1.8rem;color:#FF6B4A}
  p{color:#5a5a5a;font-size:1.08rem}
  a{display:inline-block;margin-top:24px;background:#161616;color:#fff;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:999px;box-shadow:4px 4px 0 #FF6B4A}
</style>
</head>
<body>
  <div class="card">
    <img src="img/mascot.png" alt="GoGizbi! robot" width="170" style="display:block;margin:0 auto">
    <div class="hand">got it!</div>
    <h1>Thanks — message received.</h1>
    <p>We'll get back to you by email as soon as we can.</p>
    <a href="/">Back to GoGizbi!</a>
  </div>
</body>
</html>
